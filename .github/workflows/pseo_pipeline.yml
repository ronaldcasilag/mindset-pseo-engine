name: Automated pSEO Generator

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install requests

      - name: Run Python generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python generator.py

      - name: Debug - what does git see?
        run: |
          pwd
          ls -R content || echo "content/ missing"
          git status --porcelain

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain content/tools)" ]; then
            echo "No changes to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B pseo-auto-pages
          git add content/tools
          git commit -m "Auto-generated new pSEO programmatic pages"
          git push --force origin pseo-auto-pages
          gh pr create --title "🤖 New pSEO Generated Pages" \
            --body "Automated pipeline run generated new programmatic SEO Markdown files." \
            --base "${{ github.event.repository.default_branch }}" \
            --head pseo-auto-pages || echo "PR may already exist"
