name: Automated pSEO Generator

on:
  schedule:
    - cron: '0 8 * * 1' # Runs every Monday at 8:00 AM UTC
  workflow_dispatch: # Allows manual triggers from your GitHub dashboard

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the bot permission to commit and push changes back
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python generator.py

      - name: Commit and push generated Markdown files
        run: |
          git config --global user.name "pSEO Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add content/tools/
          git commit -m "Auto-generated new pSEO programmatic pages [skip ci]" || echo "No changes to commit"
          git push
