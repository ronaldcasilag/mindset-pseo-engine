name: Automated pSEO Generator

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install requests

      - name: Run Python generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python generator.py

      - name: Debug - what does git see?
        run: |
          pwd
          ls -R content || echo "content/ missing"
          git status --porcelain

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-generated new pSEO programmatic pages"
          title: "🤖 New pSEO Generated Pages"
          body: "Automated pipeline run generated new programmatic SEO Markdown files."
          branch: pseo-auto-pages
          delete-branch: true
          add-paths: content/tools/**
